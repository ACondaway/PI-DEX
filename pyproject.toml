[project]
name = "pi-dex"
version = "0.1.0"
description = "PI-DEX research extensions for bimanual dexterous manipulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22.4,<2.0.0",
]

[project.scripts]
pi-dex-train-pytorch = "pi_dex.training.training_launcher:main"
pi-dex-volc-train = "pi_dex.training.volc_launch:main"
pi-dex-realtime-infer = "pi_dex.robot.realtime_inference:main"
pi-dex-dataset-inventory = "pi_dex.data.dataset_inventory:main"
pi-dex-prepare-dataset = "pi_dex.data.dataset_prepare:main"
pi-dex-serve = "pi_dex.serve.policy_server:main"
pi-dex-serve-probe = "pi_dex.serve.policy_server_probe:main"
pi-dex-robot-client = "pi_dex.robot.main:main"

[project.optional-dependencies]
pytorch = [
    "torch==2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_dex"]

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["tests"]

[tool.ruff]
extend = "openpi/pyproject.toml"
extend-exclude = ["openpi"]

[tool.ruff.lint.per-file-ignores]
# Keep packages importable without the vendored OpenPI/JAX training stack.
"src/pi_dex/training/openpi_integration.py" = ["PLC0415"]
"src/pi_dex/training/checkpoint_manager.py" = ["PLC0415"]
"src/pi_dex/training/distributed.py" = ["PLC0415"]
"src/pi_dex/training/training_runner.py" = ["PLC0415"]
"src/pi_dex/weights/convert_pi05.py" = ["PLC0415"]
"src/pi_dex/weights/parity_pi05.py" = ["PLC0415"]
"src/pi_dex/weights/pi05_weights.py" = ["PLC0415"]
"src/pi_dex/data/sharpa_dataset.py" = ["PLC0415"]
"src/pi_dex/data/norm_compute.py" = ["PLC0415"]
"src/pi_dex/robot/realtime_inference.py" = ["PLC0415"]
"src/pi_dex/robot/realtime_observation.py" = ["PLC0415"]
"src/pi_dex/robot/north_codec.py" = ["PLC0415"]
"src/pi_dex/robot/main.py" = ["PLC0415"]
"src/pi_dex/robot/environment.py" = ["PLC0415"]
"src/pi_dex/robot/remote_policy.py" = ["PLC0415"]
"src/pi_dex/robot/north_env.py" = ["PLC0415"]
"src/pi_dex/robot/agent.py" = ["PLC0415"]
"src/pi_dex/serve/policy_server.py" = ["PLC0415"]
